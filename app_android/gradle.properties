# Project-wide Gradle settings.
# https://docs.gradle.org/current/userguide/build_environment.html

# AndroidX migration flag – required by all AndroidX / Compose projects
android.useAndroidX=true

# Suppress compile SDK warning (SDK 35 is the latest stable; this silences the
# "compileSdk is set to 35 which is not officially released" warning on older AGP)
android.suppressUnsupportedCompileSdk=35

# Non-transitive R classes – reduces build time and avoids resource collisions
android.nonTransitiveRClass=true

# Enable Kotlin incremental compilation
kotlin.incremental=true

# Gradle daemon JVM args – bump heap for Compose/KSP
org.gradle.jvmargs=-Xmx3g -XX:+UseG1GC

# Parallel builds
org.gradle.parallel=true

# Configuration cache (safe for this project)
org.gradle.configuration-cache=false
